{% extends 'base.html' %}
{% block title %}Modifica Abbonamento — A.V.R. Informatica{% endblock %}
{% block page_title %}<i class="bi bi-pencil-fill me-2 text-avr"></i> Modifica Abbonamento{% endblock %}

{% block content %}
<form method="POST">
  <div class="card-avr" style="max-width:750px">
    <div class="card-header-avr"><i class="bi bi-collection me-2"></i> Abbonamento #{{ sub.id }}</div>
    <div class="p-4">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label required-label">Cliente</label>
          <select name="customer_id" class="form-select" required>
            {% for c in customers %}
            <option value="{{ c.id }}" {% if c.id == sub.customer_id %}selected{% endif %}>
              {{ c.full_name }}{% if c.company %} — {{ c.company }}{% endif %}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label required-label">Licenza</label>
          <select name="license_type_id" class="form-select" required>
            {% for lic in licenses %}
            <option value="{{ lic.id }}" {% if lic.id == sub.license_type_id %}selected{% endif %}>
              {{ lic.name }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-4">
          <label class="form-label">Quantità</label>
          <input type="number" name="quantity" class="form-control" value="{{ sub.quantity }}" min="1">
        </div>
        <div class="col-4">
          <label class="form-label">Ciclo</label>
          <select name="billing_cycle" class="form-select">
            <option value="yearly" {% if sub.billing_cycle == 'yearly' %}selected{% endif %}>Annuale</option>
            <option value="monthly" {% if sub.billing_cycle == 'monthly' %}selected{% endif %}>Mensile</option>
          </select>
        </div>
        <div class="col-4">
          <label class="form-label">Stato</label>
          <select name="status" class="form-select">
            <option value="active" {% if sub.status == 'active' %}selected{% endif %}>Attivo</option>
            <option value="expired" {% if sub.status == 'expired' %}selected{% endif %}>Scaduto</option>
            <option value="cancelled" {% if sub.status == 'cancelled' %}selected{% endif %}>Annullato</option>
            <option value="suspended" {% if sub.status == 'suspended' %}selected{% endif %}>Sospeso</option>
          </select>
        </div>
        <div class="col-6">
          <label class="form-label">Data Inizio</label>
          <input type="date" name="start_date" class="form-control" value="{{ sub.start_date.isoformat() }}" required>
        </div>
        <div class="col-6">
          <label class="form-label">Data Scadenza</label>
          <input type="date" name="end_date" class="form-control" value="{{ sub.end_date.isoformat() }}" required>
        </div>
        <div class="col-12">
          <label class="form-label">Prezzo Personalizzato (€)</label>
          <div class="input-group">
            <span class="input-group-text">€</span>
            <input type="number" name="custom_price" class="form-control" step="0.01"
                   value="{{ sub.custom_price or '' }}" placeholder="Lascia vuoto per prezzo di listino">
          </div>
        </div>
        <div class="col-6">
          <label class="form-label">Tenant ID Microsoft</label>
          <input type="text" name="microsoft_tenant_id" class="form-control" value="{{ sub.microsoft_tenant_id or '' }}">
        </div>
        <div class="col-6">
          <label class="form-label">Subscription ID Microsoft</label>
          <input type="text" name="microsoft_subscription_id" class="form-control" value="{{ sub.microsoft_subscription_id or '' }}">
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="auto_renew" id="autoRenew" {% if sub.auto_renew %}checked{% endif %}>
            <label class="form-check-label" for="autoRenew">Rinnovo automatico</label>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Note</label>
          <textarea name="notes" class="form-control" rows="2">{{ sub.notes or '' }}</textarea>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex gap-2 mt-4">
    <button type="submit" class="btn btn-avr px-4"><i class="bi bi-check-lg me-2"></i> Salva Modifiche</button>
    <a href="{{ url_for('subscriptions') }}" class="btn btn-outline-secondary px-4">Annulla</a>
  </div>
</form>
{% endblock %}
