{% extends 'base.html' %}
{% block title %}Modifica Licenza — A.V.R. Informatica{% endblock %}
{% block page_title %}<i class="bi bi-pencil-fill me-2 text-avr"></i> Modifica Licenza{% endblock %}

{% block content %}
<form method="POST">
  <div class="card-avr" style="max-width:600px">
    <div class="card-header-avr"><i class="bi bi-key me-2"></i> {{ license.name }}</div>
    <div class="p-4">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label required-label">Nome Licenza</label>
          <input type="text" name="name" class="form-control" value="{{ license.name }}" required>
        </div>
        <div class="col-12">
          <label class="form-label">Categoria</label>
          <input type="text" name="category" class="form-control" value="{{ license.category }}" list="categories">
          <datalist id="categories">
            <option value="Microsoft 365">
            <option value="Microsoft 365 Enterprise">
            <option value="Office 365">
            <option value="Exchange">
            <option value="Teams">
            <option value="Azure">
          </datalist>
        </div>
        <div class="col-12">
          <label class="form-label">Descrizione</label>
          <textarea name="description" class="form-control" rows="2">{{ license.description or '' }}</textarea>
        </div>
        <div class="col-6">
          <label class="form-label">Prezzo Mensile (€)</label>
          <div class="input-group">
            <span class="input-group-text">€</span>
            <input type="number" name="price_monthly" class="form-control" step="0.01" value="{{ license.price_monthly }}">
          </div>
        </div>
        <div class="col-6">
          <label class="form-label">Prezzo Annuale (€)</label>
          <div class="input-group">
            <span class="input-group-text">€</span>
            <input type="number" name="price_yearly" class="form-control" step="0.01" value="{{ license.price_yearly }}">
          </div>
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_active" id="isActive" {% if license.is_active %}checked{% endif %}>
            <label class="form-check-label" for="isActive">Licenza attiva</label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex gap-2 mt-4">
    <button type="submit" class="btn btn-avr px-4"><i class="bi bi-check-lg me-2"></i> Salva Modifiche</button>
    <a href="{{ url_for('licenses') }}" class="btn btn-outline-secondary px-4">Annulla</a>
  </div>
</form>
{% endblock %}
